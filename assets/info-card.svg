      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.49;0.61" dur="2s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="-8 0;-8 0;0 0" keyTimes="0;0.49;0.61" dur="2s" fill="freeze" />
    </g>
<g opacity="0" transform="translate(-8 0)">
      <text x="34" y="154" class="line"><tspan fill="#55d68a">university</tspan>  <tspan fill="#e6edf3">Université Paris-Saclay · UVSQ</tspan></text>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.63;0.75" dur="2s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="-8 0;-8 0;0 0" keyTimes="0;0.63;0.75" dur="2s" fill="freeze" />
    </g>
<g opacity="0" transform="translate(-8 0)">
      <text x="34" y="190" class="line"><tspan fill="#55d68a">location</tspan>  <tspan fill="#e6edf3">Paris, France</tspan></text>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.77;0.89" dur="2s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="-8 0;-8 0;0 0" keyTimes="0;0.77;0.89" dur="2s" fill="freeze" />
    </g>

<g opacity="0" transform="translate(-8 0)">
      <text x="34" y="262" class="line"><tspan fill="#55d68a">education</tspan>  <tspan fill="#e6edf3">BSc Mathematics &amp; Physics — in progress</tspan></text>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;1.05;1.17" dur="2s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="-8 0;-8 0;0 0" keyTimes="0;1.05;1.17" dur="2s" fill="freeze" />
    </g>
<g opacity="0" transform="translate(-8 0)">
      <text x="34" y="298" class="line"><tspan fill="#55d68a">interests</tspan>  <tspan fill="#e6edf3">Artificial Intelligence · Web Development</tspan></text>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;1.19;1.31" dur="2s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="-8 0;-8 0;0 0" keyTimes="0;1.19;1.31" dur="2s" fill="freeze" />
    </g>
<g opacity="0" transform="translate(-8 0)">
      <text x="34" y="334" class="line"><tspan fill="#55d68a">&gt;</tspan>          <tspan fill="#e6edf3">Computer Science · Cybersecurity</tspan></text>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;1.33;1.4500000000000002" dur="2s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="-8 0;-8 0;0 0" keyTimes="0;1.33;1.4500000000000002" dur="2s" fill="freeze" />
