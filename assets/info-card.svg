  <g opacity="0"><text x="34" y="366" class="line" fill="#55d68a">$ <tspan fill="#8b949e">_</tspan></text><animate attributeName="opacity" values="0;0;1" keyTimes="0;.93;1" dur="2s" fill="freeze" /></g>
