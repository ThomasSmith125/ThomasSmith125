  <text x="420" y="132" fill="#e1eff7" class="title">IDENTITY / DATA CARD</text>
  <text x="850" y="132" text-anchor="end" fill="#4fa3c7" class="micro">ONLINE</text>
  <text x="420" y="170" class="line"><tspan fill="#4fa3c7">NAME        </tspan><tspan fill="#e1eff7">  Thomas Smith</tspan></text><text x="420" y="200" class="line"><tspan fill="#4fa3c7">ROLE        </tspan><tspan fill="#e1eff7">  Student &amp; Entrepreneur</tspan></text><text x="420" y="230" class="line"><tspan fill="#4fa3c7">UNIVERSITY  </tspan><tspan fill="#e1eff7">  Université Paris-Saclay · UVSQ</tspan></text><text x="420" y="260" class="line"><tspan fill="#4fa3c7">LOCATION    </tspan><tspan fill="#e1eff7">  Paris, France</tspan></text><text x="420" y="320" class="line"><tspan fill="#4fa3c7">EDUCATION   </tspan><tspan fill="#e1eff7">  BSc Mathematics &amp; Physics — in progress</tspan></text><text x="420" y="350" class="line"><tspan fill="#4fa3c7">INTERESTS   </tspan><tspan fill="#e1eff7">  Artificial Intelligence · Web Development</tspan></text><text x="420" y="380" class="line"><tspan fill="#4fa3c7">//          </tspan><tspan fill="#e1eff7">  Computer Science · Cybersecurity</tspan></text>
